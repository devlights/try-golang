# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    cmds:
      - task: run-apps
      - pkill app-recv
  run-tcpdump:
    cmds:
      - sudo tcpdump -i lo -nn -v 'ip and udp dst port 5000'
    interactive: true
  run-apps:
    cmds:
      - task: run-recv
      - task: run-send
  run-recv:
    internal: true
    dir: recv
    cmds:
      - go build -o app-recv main.go
      - ./app-recv &
  run-send:
    internal: true
    dir: send
    cmds:
      - go build -o app-send main.go
      - ./app-send